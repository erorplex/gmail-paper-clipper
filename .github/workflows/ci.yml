name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: for f in src/*.js scripts/*.js test/*.js; do node --check "$f"; done
      - name: Manifest and locales are valid JSON
        run: node -e 'for (const f of ["manifest.json", "_locales/de/messages.json", "_locales/en/messages.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'
      - name: Unit tests
        run: npm test
      - name: Shell scripts
        run: shellcheck install.sh uninstall.sh update.sh auto-update.sh

  extension:
    name: Extension (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real extension against mocked Gmail
        run: npm run test:e2e

  helper:
    name: macOS helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build
        run: npm run build:helper
      - name: End-to-end test
        run: npm run test:helper
